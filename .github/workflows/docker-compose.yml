name: Docker Compose CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build services
        run: docker compose build

      - name: Start services
        run: docker compose up -d

      - name: Wait for services to be ready
        run: |
          echo "Waiting for services to start..."
          sleep 30

      - name: Health check - User Service
        run: |
          for i in {1..10}; do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "User Service is healthy"
              exit 0
            fi
            echo "Waiting for User Service... attempt $i"
            sleep 5
          done
          echo "User Service failed to start"
          exit 1
        continue-on-error: true

      - name: Health check - Order Service
        run: |
          for i in {1..10}; do
            if curl -sf http://localhost:8001/health > /dev/null 2>&1; then
              echo "Order Service is healthy"
              exit 0
            fi
            echo "Waiting for Order Service... attempt $i"
            sleep 5
          done
          echo "Order Service failed to start"
          exit 1
        continue-on-error: true

      - name: Health check - Frontend
        run: |
          for i in {1..10}; do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "Frontend is healthy"
              exit 0
            fi
            echo "Waiting for Frontend... attempt $i"
            sleep 5
          done
          echo "Frontend failed to start"
          exit 1
        continue-on-error: true

      - name: Show container logs
        if: failure()
        run: docker compose logs

      - name: Cleanup
        if: always()
        run: docker compose down -v
